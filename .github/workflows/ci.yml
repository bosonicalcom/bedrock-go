name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    uses: bosonicalcom/github-workflows/.github/workflows/ci-go.yml@master
    secrets: inherit
    with:
      go-version: "1.26.0"
      docker-build: false
