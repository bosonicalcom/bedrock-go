version: "3"

tasks:
  gen-mocks:
    desc: Regenerate all mocks from //go:generate directives
    cmd: go generate ./...

  generate:
    desc: Regenerate all mocks
    cmd: go generate ./...

  test:
    desc: Run all unit tests
    cmd: go test -timeout 1m ./...

  test:integration:
    desc: Run integration tests (requires Docker)
    cmd: go test -tags integration -timeout 1m ./...

  vet:
    desc: Run go vet
    cmd: go vet ./...

  lint:
    desc: Run golangci-lint
    cmd: go tool -modfile=golangci-lint.mod golangci-lint run ./...

  lint:upgrade:
    desc: Upgrade golangci-lint to the latest version
    cmd: go get -tool -modfile=golangci-lint.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

  release:
    desc: Create and push a semver tag to trigger a GoReleaser release (e.g. task release:tag VERSION=v1.2.3)
    requires:
      vars: [VERSION]
    cmds:
      - git tag v{{.VERSION}}
      - git push origin v{{.VERSION}}
